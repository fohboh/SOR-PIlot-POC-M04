/* ═══════════════════════════ PDF PARSER (pdf.js — text extraction, no inference) ═══════════════════════════ */
async function extractRows(arrayBuffer){
  const pdf = await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  const rows = [];
  for (let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const byY = [];
    for (const it of tc.items){
      if (!it.str || !it.str.trim()) continue;
      const y = Math.round(it.transform[5]), x = it.transform[4];
      let row = byY.find(r=>Math.abs(r.y-y)<=2);
      if (!row){ row={y,items:[]}; byY.push(row); }
      row.items.push({x,str:it.str});
    }
    byY.sort((a,b)=>b.y-a.y);
    for (const r of byY){ r.items.sort((a,b)=>a.x-b.x); rows.push(r.items.map(i=>i.str.trim()).join(" ").replace(/\s+/g," ")); }
  }
  return rows;
}
const num = s => parseFloat(String(s).replace(/[$,]/g,""));
function parseInvoice(rows, fileName){
  const text = rows.join("\n");
  const get = re => { const m = text.match(re); return m ? m[1].trim() : null; };
  const inv = {
    fileName, vendor: (rows[0]||"Unknown vendor").replace(/\s+INVOICE\s*$/i,"").trim(),
    vendorContact: get(/([a-z0-9._-]+@[a-z0-9.-]+\.[a-z]{2,})/i),
    id: get(/Invoice No:?\s*([A-Z]{2,4}-\d{4}-\d{4,6})/i),
    date: get(/Invoice Date:?\s*([A-Za-z]+ \d{1,2}, \d{4})/i),
    dueDate: get(/Due Date:?\s*([A-Za-z]+ \d{1,2}, \d{4})/i),
    po: get(/PO Number:?\s*([A-Z0-9-]+)/i),
    receivingRef: get(/Receiving Ref:?\s*([A-Z]{2}-\d{4,6})/i),
    operator: null, operatorSite: null,
    subtotal: num(get(/Subtotal\s+\$?([\d,]+\.\d{2})/i)),
    tax: num(get(/Sales Tax[^$\n]*\$?([\d,]+\.\d{2})/i)),
    taxLabel: get(/(Sales Tax[^$\n]*)\$/i),
    total: num(get(/TOTAL DUE\s+\$?([\d,]+\.\d{2})/i)),
    lineItems: [],
  };
  const bt = rows.findIndex(r=>/^BILL TO/i.test(r));
  if (bt>=0){ inv.operator = (rows[bt+1]||"").replace(/\s+DELIVERY.*$/,"").trim(); inv.operatorSite = (rows[bt+2]||"").replace(/\s+(Receiving Ref|Terms:).*$/,"").trim(); }
  // Rows can merge across the two-column band; strip the right column if it leaked in.
  if (inv.operator && inv.operator.includes("Receiving Ref")) inv.operator = inv.operator.split("Receiving Ref")[0].trim();
  const lineRe = /^([A-Z0-9]+(?:-[A-Z0-9]+)+)\s+(.+?)\s+(\d+)\s+([A-Z]{2,4})\s+\$([\d,]+\.\d{2})\s+\$([\d,]+\.\d{2})$/;
  for (const r of rows){ const m = r.match(lineRe); if (m) inv.lineItems.push({sku:m[1],description:m[2],qty:+m[3],unit:m[4],unitPrice:num(m[5]),lineTotal:num(m[6])}); }
  if (!inv.id || inv.lineItems.length===0 || isNaN(inv.total)) {
    const err = new Error("PARSE_FAIL"); err.detail = `Parsed ${inv.lineItems.length} line item(s); invoice id ${inv.id||"not found"}; total ${isNaN(inv.total)?"not found":money(inv.total)}.`; throw err;
  }
  return inv;
}

function parsePO(rows, fileName){
  const text = rows.join("\n"); const get = re => { const m = text.match(re); return m ? m[1].trim() : null; };
  const po = { fileName, id:get(/PO Number:?\s*([A-Z]{2,4}-[A-Z]{2,4}-\d{3,6})/i), date:get(/Order Date:?\s*([A-Za-z]+ \d{1,2}, \d{4})/i),

  const vi = rows.findIndex(r=>/^VENDOR/i.test(r)); if (vi>=0) po.vendor = (rows[vi+1]||"").replace(/\s+SHIP TO.*$/i,"").trim();
  const lineRe = /^([A-Z0-9]+(?:-[A-Z0-9]+)+)\s+(.+?)\s+(\d+)\s+([A-Z]{2,4})\s+\$([\d,]+\.\d{2})\s+\$([\d,]+\.\d{2})$/;
  for (const r of rows){ const m=r.match(lineRe); if (m) po.lines.push({sku:m[1],description:m[2],qty:+m[3],unit:m[4],unitPrice:num(m[5]),lineTotal:num(m[6])}); }
  if (!po.id || !po.lines.length){ const e=new Error("PARSE_FAIL"); e.detail=`Purchase order: parsed ${po.lines.length} line(s); PO number ${po.id||"not found"}.`; throw e; }

}
function parseReceiving(rows, fileName){
  const text = rows.join("\n"); const get = re => { const m = text.match(re); return m ? m[1].trim() : null; };
  const rl = { fileName, ref:get(/Receiving Ref:?\s*([A-Z]{2}-\d{4,6})/i), delivered:get(/Delivered:?\s*(\d{2}\/\d{2}\/\d{4}[^\n]*?)(?:\s+PO Ref|$)/im),
    poRef:get(/PO Ref:?\s*([A-Z]{2,4}-[A-Z]{2,4}-\d{3,6})/i), invoiceRef:get(/Invoice Ref:?\s*([A-Z]{2,4}-\d{4}-\d{4,6})/i),
    operator:(rows[0]||"").replace(/\s+RECEIVING LOG\s*$/i,"").trim(), vendor:null, receivedBy:null, items:{}, ordered:{}, refused:{}, lines:[] };
  const vi = rows.findIndex(r=>/^VENDOR/i.test(r));
  if (vi>=0){ const row=(rows[vi+1]||"").trim(); const m=row.match(/([A-Z]\.\s+[A-Za-z'’-]+\s*\([^)]+\))\s*$/); rl.receivedBy = m ? m[1].trim() : null; rl.vendor = (m ? row.slice(0,m.index) : row).replace(/\s+RECEIVED BY.*$/i,"").trim(); }
  const lineRe = /^([A-Z0-9]+(?:-[A-Z0-9]+)+)\s+(.+?)\s+(\d+)\s+(\d+)\s+(\d+)\s+([A-Z]{2,4})$/;
  for (const r of rows){ const m=r.match(lineRe); if (m){ rl.lines.push({sku:m[1],description:m[2],ordered:+m[3],received:+m[4],refused:+m[5],unit:m[6]}); rl.items[m[1]]=+m[4]; rl.ordered[m[1]]=+m[3]; rl.refused[m[1]]=+m[5]; } }
  rl.signed = `${rl.delivered||"—"} · ${rl.receivedBy||"receiver on file"}`;
  if (!rl.ref || !rl.lines.length){ const e=new Error("PARSE_FAIL"); e.detail=`Receiving log: parsed ${rl.lines.length} line(s); receiving ref ${rl.ref||"not found"}.`; throw e; }
  return rl;
}

/* ═══════════════════════════ DETERMINISTIC RULES ENGINE — Sentry M04:SCR (rule set R211–R330, v1.0 draft) ═══════════════════════════ */
/* Invoice Accuracy components (M04) — weighted; measure how accurately the vendor billed. Feed the Vendor Reliability Score, not the Trust Score. */

/* The 11 MGE Trust Gates — pass/fail threshold controls, always run TG01 → TG11, none skipped. TG07 and TG11 are dominant. */
const TRUST_GATES = [
  {id:"TG01",name:"Data Completeness"},
  {id:"TG02",name:"Source Authenticity"},

];
const RULES = [
  {id:"R236",name:"Trust Score Floor — Certification Block",gate:"TS · TG11"},
  {id:"R211",name:"Invoice Unit Price vs. Contract Price Variance",gate:"IA-01"},
  {id:"R221",name:"Invoiced Quantity vs. Receiving Log Mismatch",gate:"IA-02"},
  {id:"R240",name:"Three-Way Match — Invoice vs. PO vs. Receiving",gate:"IA-02"},
  {id:"R226",name:"Duplicate Detection — Line-Level",gate:"IA-06"},
  {id:"R228",name:"Outstanding Credit Memo — Not Applied",gate:"IA-03"},
  {id:"R237",name:"Contract Term Compliance — Tax & Exemption Terms",gate:"IA-04"},

const PRICE_TOLERANCE = 0.01; // R211 default tolerance 1%
const CERT_THRESHOLD = 85;    // Trust Score certification threshold — a CAAR requires Trust Score ≥ 85 (R236, TG11)
const r2 = v => Math.round(v*100)/100;
const toISO = s => { const d = new Date(s); return isNaN(d) ? null : d.toISOString().slice(0,10); };
const normKey = k => String(k||"").toLowerCase().replace(/[^a-z0-9|]+/g,"");
const lookup = (table,key) => { const nk=normKey(key); const hit=Object.keys(table).find(k=>normKey(k)===nk); return hit!==undefined ? table[hit] : undefined; };
const gateScore = (amt, base) => Math.max(0, Math.round(100 - Math.min(100, (amt/base)*800)));

function runRules(inv, ctx={}){
  const contract = lookup(REF.contracts, inv.vendor);
  const recv = ctx.recvDoc || lookup(REF.receiving, inv.receivingRef);
  const recvSource = ctx.recvDoc ? `uploaded receiving log ${ctx.recvDoc.ref}` : (recv ? `receiving log ${inv.receivingRef} (system of record)` : "none");
  const po = ctx.po || null;
  const taxProfile = lookup(REF.tax, inv.operator);
  const credits = lookup(REF.credits, `${inv.vendor}|${inv.operator}`)||[];
  const histRaw = lookup(REF.vendorHistory, inv.vendor);
  const hist = histRaw||{priorScore:75,trend:"STABLE",certified90d:0,priorFlags:[]};
  const lines = inv.lineItems.map(l=>({...l,flag:"OK",expectedLineTotal:r2(l.qty*l.unitPrice)}));
  const R = {};
  const invISO = toISO(inv.date);
  const headerSum = r2(lines.reduce((s,l)=>s+l.lineTotal,0));
  const headerOK = Math.abs(r2(inv.subtotal+inv.tax)-inv.total)<=0.01 && Math.abs(headerSum-inv.subtotal)<=0.01;

  /* ── Trust Score — six dimensions: completeness, validation, reconciliation, integrity, drift detection, rule execution ── */
  const hdrFields = ["id","date","dueDate","operator","receivingRef","vendorContact","subtotal","tax","total"];
  const hdrPresent = hdrFields.filter(k=>inv[k]!==null && inv[k]!==undefined && inv[k]!=="" && !(typeof inv[k]==="number" && isNaN(inv[k]))).length;
  const linesOK = lines.filter(l=>l.sku && l.qty>0 && l.unitPrice>=0 && l.lineTotal>=0).length;
  const completeness = Math.round((hdrPresent/hdrFields.length)*60 + (lines.length?linesOK/lines.length:0)*40);
  const consistency = headerOK ? 100 : 40;
  let timeliness = 30, timelinessNote = "No receiving log matched — delivery timing cannot be evidenced.";
  if (recv){ const m = recv.signed.match(/(\d{2})\/(\d{2})\/(\d{4})/); const rd = m ? new Date(`${m[3]}-${m[1]}-${m[2]}`) : null; const idt = invISO ? new Date(invISO) : null;
    if (rd && idt){ const days = Math.round(Math.abs((rd-idt)/86400000)); timeliness = days<=1?100:days<=3?90:days<=7?75:50; timelinessNote = `Receiving log signed ${days} day${days===1?"":"s"} from invoice date.`; } }
  const skusWithRate = contract ? lines.filter(l=>contract.rates[l.sku]!==undefined).length : 0;
  const alignment = lines.length ? Math.round((skusWithRate/lines.length)*100) : 0;
  const sources = [["Master vendor agreement",!!contract],["Receiving log",!!recv],["Operator tax profile",!!taxProfile],["90-day vendor history",!!histRaw]];
  if (ctx.threeWay) sources.splice(2,0,["Purchase order",!!po]);
  const reconIntegrity = Math.round((sources.filter(x=>x[1]).length/sources.length)*100);
  const evaluableRules = 7 - (contract?0:1) - (recv?0:2) - (taxProfile?0:1);
  const governance = Math.round((evaluableRules/7)*100);
  const sealed = !!(ctx.docHash || ctx.hashes);
  const attested = !!ctx.attestation;
  const integrity = sealed ? (attested ? 100 : 90) : 0;
  const drift = Math.round((alignment + timeliness)/2);
  const dims = [
    {key:"completeness",label:"Completeness",score:completeness,note:`${hdrPresent}/${hdrFields.length} header fields · ${linesOK}/${lines.length} line items fully parsed.`},
    {key:"validation",label:"Validation",score:consistency,note:headerOK?"Line items, subtotal, tax and total validate arithmetically.":"Header arithmetic does not validate."},
    {key:"reconciliation",label:"Reconciliation",score:reconIntegrity,note:`${sources.filter(x=>x[1]).length}/${sources.length} authoritative sources available to reconcile against: ${sources.map(x=>`${x[0]} ${x[1]?"✓":"✗"}`).join(", ")}.`},
    {key:"integrity",label:"Integrity",score:integrity,note:sealed?`SHA-256 sealed at the Landing Zone on receipt${attested?"; custodian attestation bound into the seal":"; no custodian attestation on this run"}.`:"Document was not sealed on receipt."},
    {key:"drift",label:"Drift detection",score:drift,note:`${contract?`${skusWithRate}/${lines.length} billed SKUs carry a current contracted rate`:"No master agreement on file — no contracted baseline to measure drift against"}. ${timelinessNote}`},
    {key:"rules",label:"Rule execution",score:governance,note:`${evaluableRules}/7 M04 rules evaluable on the evidence available.`},
  ];
  const tsScore = Math.round(dims.reduce((a,d)=>a+d.score,0)/dims.length);
  const tsMet = tsScore >= CERT_THRESHOLD;

  /* ── R226 · Duplicate Detection — line-level (IA-06) ── same SKU on a second line; receiving log supports only the first quantity */
  const seen = {};
  lines.forEach((l,i)=>{ if (seen[l.sku]!==undefined){ const first=lines[seen[l.sku]]; const rq = recv ? recv.items[l.sku] : undefined; if (rq!==undefined && rq<=first.qty){ l.flag="DUPLICATE_LINE"; l.expectedLineTotal=0; } } else seen[l.sku]=i; });
  const dupes = lines.filter(l=>l.flag==="DUPLICATE_LINE"); const dupAmt = r2(dupes.reduce((s,l)=>s+l.lineTotal,0));
  R.R226 = dupes.length ? {ruleId:"R226",ruleName:"Duplicate Detection — Line-Level",gate:"IA-06",scope:`SKU: ${dupes.map(d=>d.sku).join(", ")}`,result:"FAIL",
      finding:dupes.map(d=>`${d.sku} appears on a second line (${d.qty} ${d.unit}); receiving log ${inv.receivingRef} supports a single delivery of ${recv.items[d.sku]} ${d.unit}.`).join(" "),
      recoveryAmount:dupAmt,evidence:`${recvSource[0].toUpperCase()+recvSource.slice(1)} (${recv.signed}) cross-referenced against invoice line sequence.`,kind:"duplicate"}
    : {ruleId:"R226",ruleName:"Duplicate Detection — Line-Level",gate:"IA-06",scope:"Full invoice",result:"PASS",finding:`No duplicate SKUs or charges detected across ${lines.length} line items.`,recoveryAmount:0,evidence:`SKU hash check returned ${new Set(lines.map(l=>l.sku)).size} unique entries.`};

  /* ── R211 · Invoice Unit Price vs. Contract Price Variance (IA-01) · tolerance 1% ── */
  const priceHits = [];
  if (contract) lines.filter(l=>l.flag!=="DUPLICATE_LINE").forEach(l=>{ const rate=contract.rates[l.sku]; if (rate!==undefined && l.unitPrice > rate*(1+PRICE_TOLERANCE)){ l.flag="PRICE_VARIANCE"; l.expectedLineTotal=r2(l.qty*rate); priceHits.push({l,rate,amt:r2(l.qty*(l.unitPrice-rate))}); } });
  const priceAmt = r2(priceHits.reduce((s,h)=>s+h.amt,0));
  R.R211 = !contract ? {ruleId:"R211",ruleName:"Invoice Unit Price vs. Contract Price Variance",gate:"IA-01",scope:"No contract on file",result:"N/A",finding:"No master vendor agreement on file for this vendor — rule not evaluated.",recoveryAmount:0,evidence:"—"}
    : priceHits.length ? {ruleId:"R211",ruleName:"Invoice Unit Price vs. Contract Price Variance",gate:"IA-01",scope:`Line: ${priceHits.map(h=>h.l.sku).join(", ")}`,result:"FAIL",
      finding:priceHits.map(h=>`${h.l.description} billed at ${money(h.l.unitPrice)}/${h.l.unit} against contract rate of ${money(h.rate)}/${h.l.unit} (${(((h.l.unitPrice/h.rate)-1)*100).toFixed(1)}% above, tolerance 1%); ${h.l.qty} ${h.l.unit} exposure, ${money(h.amt)} overcharge.`).join(" "),
      recoveryAmount:priceAmt,evidence:contract.agreement+". Formula: (invoice unit price − contract unit price) × quantity.",kind:"price"}
    : {ruleId:"R211",ruleName:"Invoice Unit Price vs. Contract Price Variance",gate:"IA-01",scope:`All ${lines.length} line items`,result:"PASS",finding:"All line items billed at or within 1% of contracted rates.",recoveryAmount:0,evidence:contract.agreement+"."};

  /* ── R221 · Invoiced Quantity vs. Receiving Log Mismatch (IA-02) ── */
  const qtyHits = [];
  if (recv) lines.filter(l=>l.flag!=="DUPLICATE_LINE").forEach(l=>{ const rq=recv.items[l.sku]; if (rq!==undefined && l.qty>rq){ const rate = l.flag==="PRICE_VARIANCE" ? contract.rates[l.sku] : l.unitPrice; if (l.flag==="OK") l.flag="QTY_VARIANCE"; l.expectedLineTotal=r2(rq*rate); qtyHits.push({l,rq,amt:r2((l.qty-rq)*rate)}); } });
  const qtyAmt = r2(qtyHits.reduce((s,h)=>s+h.amt,0));
  R.R221 = !recv ? {ruleId:"R221",ruleName:"Invoiced Quantity vs. Receiving Log Mismatch",gate:"IA-02",scope:"No receiving log",result:"N/A",finding:"No receiving log matched this invoice — rule not evaluated.",recoveryAmount:0,evidence:"—"}
    : qtyHits.length ? {ruleId:"R221",ruleName:"Invoiced Quantity vs. Receiving Log Mismatch",gate:"IA-02",scope:`Line: ${qtyHits.map(h=>h.l.sku).join(", ")}`,result:"FAIL",
      finding:qtyHits.map(h=>`${h.l.description}: invoiced ${h.l.qty} ${h.l.unit}, receiving log records ${h.rq} ${h.l.unit}. ${h.l.qty-h.rq} ${h.l.unit} short, ${money(h.amt)} billed for product not received.`).join(" "),
      recoveryAmount:qtyAmt,evidence:`${recvSource[0].toUpperCase()+recvSource.slice(1)}, signed ${recv.signed}. Formula: (invoiced qty − received qty) × unit price.`,kind:"delivery"}
    : {ruleId:"R221",ruleName:"Invoiced Quantity vs. Receiving Log Mismatch",gate:"IA-02",scope:"Receiving log cross-check",result:"PASS",finding:"All invoiced quantities match the receiving dock log.",recoveryAmount:0,evidence:`${recvSource[0].toUpperCase()+recvSource.slice(1)}, signed ${recv.signed}.`};

  /* ── R240 · Three-Way Match — invoice arithmetic leg + PO/receiving value (IA-02) ── */
  const mathHits = [];
  lines.forEach(l=>{ const ext=r2(l.qty*l.unitPrice); if (Math.abs(ext-l.lineTotal)>0.005){ if (l.flag==="OK") l.flag="EXTENSION_ERROR"; if (l.flag!=="DUPLICATE_LINE") l.expectedLineTotal=Math.min(l.expectedLineTotal,ext); mathHits.push({l,ext,amt:r2(l.lineTotal-ext)}); } });
  const mathAmt = r2(mathHits.reduce((s,h)=>s+Math.max(0,h.amt),0));
  const rateFor = sku => (contract && contract.rates[sku]!==undefined) ? contract.rates[sku] : (po && (po.lines.find(l=>l.sku===sku)||{}).unitPrice) ?? null;
  const poValue = po ? (po.total || r2(po.lines.reduce((s,l)=>s+l.lineTotal,0))) : ((contract&&recv) ? r2(Object.entries(recv.items).reduce((s,[sku,q])=>s+q*(contract.rates[sku]??0),0)) : null);
  const recvValue = recv ? r2(Object.entries(recv.items).reduce((s,[sku,q])=>{ const r=rateFor(sku); return s + (r!==null ? q*r : 0); },0)) : null;
  const poMatch = po ? (po.id === inv.po ? "PO number matches the invoice reference." : `PO ${po.id} does not match the invoice reference ${inv.po||"—"}.`) : "";
  const threeWay = poValue!==null ? ` ${po?"Purchase order":"PO value at contract"} ${money(poValue)} · invoice ${money(inv.subtotal)}${recvValue!==null?` · received ${money(recvValue)}`:""}; largest leg variance ${money(Math.max(Math.abs(r2(inv.subtotal-poValue)), recvValue!==null?Math.abs(r2(inv.subtotal-recvValue)):0))}${(priceHits.length||qtyHits.length||dupes.length)?" — attributed to R211/R221/R226 findings":" — within tolerance"}. ${poMatch}`.trim() : "";
  R.R240 = (mathHits.length||!headerOK) ? {ruleId:"R240",ruleName:"Three-Way Match — Invoice vs. PO vs. Receiving",gate:"IA-02",scope:mathHits.length?`Line: ${mathHits.map(h=>h.l.sku).join(", ")}`:"Invoice header",result:"FAIL",
      finding:(mathHits.map(h=>`${h.l.qty} × ${money(h.l.unitPrice)} = ${money(h.ext)}, not ${money(h.l.lineTotal)} as billed. ${money(Math.abs(h.amt))} ${h.amt>0?"overcharge":"undercharge"}.`).join(" ") + (headerOK?"":` Header does not reconcile: lines sum ${money(headerSum)}, stated subtotal ${money(inv.subtotal)}.`) + (threeWay?" "+threeWay:"")).trim(),
      recoveryAmount:mathAmt,evidence:po?`Purchase order ${po.id} (${po.date}) and ${recvSource}; line extensions recomputed.`:"Arithmetic recomputation of each line extension and header; PO value derived from receiving quantities at contract rates.",kind:"math"}
    : {ruleId:"R240",ruleName:"Three-Way Match — Invoice vs. PO vs. Receiving",gate:"IA-02",scope:"All line items + header",result:"PASS",finding:(`All ${lines.length} extensions verified and header reconciles (lines ${money(headerSum)} + tax ${money(inv.tax)} = ${money(inv.total)}).`+(threeWay?" "+threeWay:"")).trim(),recoveryAmount:0,evidence:po?`Purchase order ${po.id} (${po.date}) and ${recvSource}.`:"Arithmetic recomputation; PO value derived from receiving quantities at contract rates."};

  /* ── R228 · Outstanding Credit Memo — not applied (IA-03) ── */
  const open = credits.filter(c=>!c.appliedOn && invISO && c.issued<=invISO); const credAmt = r2(open.reduce((s,c)=>s+c.amount,0));
  R.R228 = open.length ? {ruleId:"R228",ruleName:"Outstanding Credit Memo — Not Applied",gate:"IA-03",scope:`Open credits: ${open.map(c=>c.id).join(", ")}`,result:"FAIL",
      finding:open.map(c=>`Credit memo ${c.id} for ${money(c.amount)} (issued ${c.issued}, ${c.reason}) was open at invoice date and not applied to this invoice.`).join(" "),recoveryAmount:credAmt,evidence:"Vendor credit ledger, reconciled against invoice remittance block.",kind:"credit"}
    : {ruleId:"R228",ruleName:"Outstanding Credit Memo — Not Applied",gate:"IA-03",scope:"Open credits",result:"PASS",finding:"No outstanding credit memos for this vendor/operator pair at invoice date.",recoveryAmount:0,evidence:"Vendor credit ledger shows zero open balance."};

  /* ── R237 · Contract Term Compliance — tax & exemption terms (IA-04) ── */
  let taxAmt = 0;
  if (!taxProfile) R.R237 = {ruleId:"R237",ruleName:"Contract Term Compliance — Tax & Exemption Terms",gate:"IA-04",scope:"Tax line",result:"N/A",finding:"No tax profile on file for this operator — rule not evaluated.",recoveryAmount:0,evidence:"—"};
  else { const expTax=r2(inv.subtotal*taxProfile.rate), diff=r2(inv.tax-expTax);
    if (Math.abs(diff)>0.02){ taxAmt=Math.max(0,diff); R.R237={ruleId:"R237",ruleName:"Contract Term Compliance — Tax & Exemption Terms",gate:"IA-04",scope:"Tax line",result:"FAIL",finding:`Tax billed ${money(inv.tax)}; approved treatment for ${inv.operator} is ${(taxProfile.rate*100).toFixed(2)}% → expected ${money(expTax)}. ${money(Math.abs(diff))} ${diff>0?"overcharged":"undercharged"}.`,recoveryAmount:taxAmt,evidence:taxProfile.basis+".",kind:"tax"}; }
    else R.R237={ruleId:"R237",ruleName:"Contract Term Compliance — Tax & Exemption Terms",gate:"IA-04",scope:"Tax line",result:"PASS",finding:`Tax of ${money(inv.tax)} = ${(taxProfile.rate*100).toFixed(2)}% × ${money(inv.subtotal)}. Within rounding tolerance.`,recoveryAmount:0,evidence:taxProfile.basis+"."}; }


  /* ── The 11 Trust Gates TG01–TG11 — pass/fail controls, run in order, none skipped ── */
  const log = ctx.log || [];
  const chainOK = log.every((e,i)=>e.n===i+1 && e.prev===(i?log[i-1].hash:"0".repeat(64)));
  const poCovers = po ? lines.every(l=>po.lines.some(p=>p.sku===l.sku)) : false;
  const feeBasis = contract ? alignment===100 : poCovers;
  const tgRes = {
    TG01:[completeness>=CERT_THRESHOLD, `Completeness ${completeness}/100 (required ${CERT_THRESHOLD}) — ${hdrPresent}/${hdrFields.length} header fields, ${linesOK}/${lines.length} lines parsed.`],
    TG02:[sealed, sealed?`Document SHA-256 sealed on receipt${attested?"; named custodian attested personally":""} — source is authentic as received.`:"Document was not sealed on receipt."],
    TG03:[!!contract, contract?`Vendor profile current: ${contract.agreement}.`:`No master vendor agreement on file for ${inv.vendor} — vendor profile is not established.`],
    TG04:[!!recv, recv?`Invoice reconciled against the system of record — ${recvSource}.`:"No receiving log in the system of record to reconcile this invoice against."],
    TG05:[true, "Submission is unique — no duplicate document or overlapping invoice in this evidence batch. (Duplicate lines billed by the vendor are a finding under R226, not a data defect.)"],
    TG06:[!!contract && !!recv && timeliness>=75, (contract&&recv)?`Invoice date is covered by the contract term and a receiving log dated within the window. ${timelinessNote}`:"The invoice period is not covered by both a contract term and a receiving record."],
    TG07:[feeBasis, feeBasis?`Every billed charge has a legitimate basis on file — ${contract?"a contracted rate":"a purchase-order line"} for each of ${lines.length} SKUs. Variances against that basis are findings, not gate failures.`:`${contract?`${lines.length-skusWithRate} billed SKU(s) have no contracted rate`:"No contracted rate or PO line on file"} — the legitimacy of the charges cannot be established. Dominant gate: CAAR blocked.`],
    TG08:[true, "M04 rule set R211–R330 v1.0 and its formulas are version-locked for this run."],
    TG09:[chainOK && log.length>=2, `Activity log hash chain verified — ${log.length} entr${log.length===1?"y":"ies"} linked from receipt${log.length<2?" (too few entries)":""}.`],
    TG10:[true, "Certification narrative is generated from the certified record and sealed inside the payload at issuance."],
  };
  const priorOK = Object.values(tgRes).every(v=>v[0]);
  const certified = priorOK && tsMet;
  tgRes.TG11 = [certified, certified?`All ten prior gates passed and Trust Score ${tsScore} ≥ ${CERT_THRESHOLD}. CAAR generation authorized.`
    : `CAAR blocked — ${[!priorOK?`gate${Object.entries(tgRes).filter(([k,v])=>!v[0]).length>1?"s":""} ${Object.entries(tgRes).filter(([k,v])=>!v[0]).map(([k])=>k).join(", ")} failed`:"", !tsMet?`Trust Score ${tsScore} below ${CERT_THRESHOLD}`:""].filter(Boolean).join("; ")}.`];
  const trustGates = TRUST_GATES.map(g=>({...g, passed:tgRes[g.id][0], note:tgRes[g.id][1]}));
  const gatesPassed = trustGates.filter(g=>g.passed).length;

  R.R236 = {ruleId:"R236",ruleName:"Trust Score Floor — Certification Block",gate:"TS · TG11",scope:"Trust Score + Trust Gates",result:certified?"PASS":"FAIL",
    finding: certified ? `Trust Score ${tsScore}/100 meets the ${CERT_THRESHOLD} floor and all 11 Trust Gates passed. The evidence supports certification; the M04 rules fire at full confidence.`
      : `Trust Score ${tsScore}/100${tsMet?` meets the ${CERT_THRESHOLD} floor`:` is below the ${CERT_THRESHOLD} floor`}; ${gatesPassed}/11 Trust Gates passed (${trustGates.filter(g=>!g.passed).map(g=>g.id).join(", ")} failed). CAAR output is blocked; findings below are identified exposure, not certified claims.`,
    recoveryAmount:0, evidence:"Trust Score dimensions: completeness, validation, reconciliation, integrity, drift detection, rule execution. Trust Gates TG01–TG11.", blocks: !certified};
  const results = RULES.map(r=>R[r.id]);
  const failList = results.filter(r=>r.result==="FAIL" && r.ruleId!=="R236");

  /* ── Invoice Accuracy — M04 components IA-01–08 (weighted; unevaluated excluded, weights renormalized). Feeds Vendor Reliability. ── */
  const gs = {
    "IA-01": contract ? gateScore(priceAmt, inv.subtotal) : null,
    "IA-02": recv ? gateScore(qtyAmt+mathAmt, inv.subtotal) : null,
    "IA-03": gateScore(credAmt, inv.subtotal),
    "IA-04": taxProfile ? gateScore(taxAmt, inv.subtotal) : null,
    "IA-05": null, "IA-07": null,
    "IA-06": gateScore(dupAmt, inv.subtotal),
    "IA-08": tsScore,
  };
  const components = COMPONENTS.map(g=>({...g, score:gs[g.id], evaluated:gs[g.id]!==null, rules:RULES.filter(r=>r.gate===g.id).map(r=>r.id)}));
  const wSum = components.filter(g=>g.evaluated).reduce((s,g)=>s+g.w,0);
  const accuracy = Math.round(components.filter(g=>g.evaluated).reduce((s,g)=>s+g.w*g.score,0)/wSum);
  const trustScore = {score:tsScore, threshold:CERT_THRESHOLD, certified, tsMet, dims, gaps:dims.filter(d=>d.score<CERT_THRESHOLD), trustGates, gatesPassed, accuracy, components, evaluatedWeight:wSum};

  /* ── Vendor Reliability Score — 90-day rolling view of certified Trust Scores, with four sub-metrics ── */
  const price=gs["IA-01"]??100, delivery=gs["IA-02"]??100, billing=gateScore(dupAmt+mathAmt, inv.subtotal), creditTax=gateScore(credAmt+taxAmt, inv.subtotal);
  const invoiceScore = certified ? accuracy : null;
  const vscore = certified ? Math.round((invoiceScore+hist.priorScore)/2) : hist.priorScore;
  const grade = vscore>=90?"A":vscore>=80?"B":vscore>=70?"C":vscore>=60?"D":"F";
  const classification = vscore>=90?"PREFERRED":vscore>=70?"STANDARD":vscore>=50?"MONITOR":"PROBATION";
  const flags = [...hist.priorFlags];
  if (priceHits.length && !flags.includes("Price drift")) flags.push("Price drift");
  if (qtyHits.length) flags.push("Short delivery");
  if (dupes.length) flags.push("Duplicate billing");
  if (open.length) flags.push("Unapplied credits");
  if (taxAmt>0) flags.push("Tax misapplication");
  if (mathHits.length && !flags.some(f=>/extension/i.test(f))) flags.push("Extension errors");
  const narrative = !certified
    ? `Run not certified (R236 · TG11). ${inv.vendor}'s reliability record is unchanged${histRaw?` — the 90-day prior of ${hist.priorScore} (${hist.trend.toLowerCase()}, ${hist.certified90d} certified invoices) carries forward`:" — no certified history exists for this vendor yet; the default prior of 75 is shown and nothing has been written"}. Supply the missing evidence and re-run to certify.`
    : failList.length===0
    ? `${inv.vendor} passed all ${results.filter(r=>r.result!=="N/A").length} evaluated rules on this invoice. Over the last 90 days (${hist.certified90d} certified invoices) the vendor's record is ${hist.trend.toLowerCase()} at a prior score of ${hist.priorScore}. No risk flags are active — continued ${classification.toLowerCase()} status is supported by the certified record.`
    : `${inv.vendor} produced ${failList.length} variance${failList.length>1?"s":""} on this invoice (${failList.map(f=>f.ruleId).join(", ")}) against a 90-day prior score of ${hist.priorScore} (${hist.trend.toLowerCase()}, ${hist.certified90d} certified invoices). ${flags.length>=3?"Three or more active pattern flags indicate a systemic compliance issue; the certified record supports contract review, not just a credit request.":flags.length?"The active flag is documented in the vendor's certified record and will be re-evaluated on the next certified invoice.":""}`;
  const vendorScore = {score:vscore,grade,classification,trend:hist.trend,priceAccuracy:price,deliveryAccuracy:delivery,billingIntegrity:billing,creditTaxCompliance:creditTax,invoiceScore,priorScore:hist.priorScore,certified90d:hist.certified90d,riskFlags:flags,narrative};

  const totalRecovery = r2(failList.reduce((s,f)=>s+f.recoveryAmount,0));
  const probMap = {math:97,duplicate:96,tax:97,credit:98,price:92,delivery:90};
  const recoveryProbability = totalRecovery>0 ? Math.round(failList.reduce((s,f)=>s+(probMap[f.kind]||90)*f.recoveryAmount,0)/totalRecovery) : 0;
  const summary = {totalFindings:failList.length,totalRecovery,recoveryProbability,
    certificationStatus: !certified ? "NOT CERTIFIED — EVIDENCE GAP" : failList.length ? "CERTIFIED — VARIANCES DETECTED" : "CERTIFIED — COMPLIANT",
    rulesEvaluated: results.filter(r=>r.result!=="N/A").length, lineItemsScanned: lines.length};
  return {invoice:inv, lineItems:lines, ruleResults:results, vendorScore, trustScore, summary, po, recvDoc:ctx.recvDoc||null, threeWay:!!ctx.threeWay};
}

/* ═══════════════════════════ SEALING — real SHA-256 via Web Crypto ═══════════════════════════ */
async function sha256(data){
  const buf = typeof data==="string" ? new TextEncoder().encode(data) : data;
  const h = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
const short = h => h ? `${h.slice(0,8)}…${h.slice(-8)}` : "—";

/* ═══════════════════════════ GUIDE UI ═══════════════════════════ */
function GuideItem({item,isOpen,onToggle}){
  return (
    <div style={{border:`1px solid ${isOpen?C.line2:C.line}`,borderRadius:10,marginBottom:8,overflow:"hidden",background:C.card}}>
      <button onClick={onToggle} style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"12px 14px",background:"transparent",border:"none",cursor:"pointer",textAlign:"left"}}>
        <div style={{width:22,height:22,borderRadius:"50%",flexShrink:0,background:item.tagBg,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <M s={{fontSize:10,fontWeight:700,color:item.tagColor}}>{item.num}</M>
        </div>
        <span style={{fontSize:13,fontWeight:600,color:C.ink,flex:1,lineHeight:1.3,fontFamily:F.head}}>{item.label}</span>
        <span style={{fontSize:10,color:C.muted2,transform:isOpen?"rotate(180deg)":"none",transition:"transform .2s",display:"inline-block"}}>▼</span>
      </button>
      <div style={{padding:"0 14px 12px"}}>
        <Tag color={item.tagColor} bg={item.tagBg}>{item.tag}</Tag>
        {isOpen && (
          <div style={{display:"flex",flexDirection:"column",gap:12,marginTop:14}}>
            {item.rows.map((row,i)=>(
              <div key={i} style={{borderLeft:`3px solid ${row.kc}`,paddingLeft:12}}>
                <Label color={row.kc} style={{marginBottom:4}}>{row.k}</Label>
                <div style={{fontSize:12.5,color:C.muted,lineHeight:1.6}}>{row.v}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════ ACTIVITY LOG — hash-chained, append-only ═══════════════════════════ */
async function appendLog(log, event){

function buildMemorandum(data){
  const c = certifiedContext(data); const fails = c.rules.filter(r=>r.result==="FAIL"&&r.id!=="R236"); const tg = data.trustScore;
  const lowGate = c.trustScore.invoiceAccuracy.components.filter(g=>g.score!==null).sort((a,b)=>a.score-b.score)[0];
  const hyp = [];
  if (fails.some(f=>f.id==="R211")) hyp.push("Price variance on a contracted SKU with no promotional or market-price notice on file — most often a vendor price-file update that ignored the contract lock (compare R212), or a substitution billed at market (compare R213).");
  if (fails.some(f=>f.id==="R226")) hyp.push("A duplicated line where the receiving log shows one delivery — typically a split-shipment line that was not reversed, or an order-entry duplicate.");
  if (fails.some(f=>f.id==="R240")) hyp.push("Extension error favoring the vendor — recurring extension errors on one vendor suggest a systemic rounding or pack-size configuration issue rather than a one-off.");
  if (fails.some(f=>f.id==="R221")) hyp.push("Short delivery signed at the dock — the receiving signature makes this the strongest claim on the invoice; check whether a partial-delivery credit was promised (R222).");
  if (fails.some(f=>f.id==="R228")) hyp.push("An open credit memo not applied — usually an AR-side posting lag; the memo exists, it was not netted.");
  if (fails.some(f=>f.id==="R237")) hyp.push("Tax charged to an exempt operator — almost always a missing resale certificate in the vendor's customer master, not intent.");
  const actions = [];
  if (!c.certified) actions.push(["Operator / AP","Supply the missing evidence named in the R236 gap list and re-run certification","Before the invoice due date"]);
  if (fails.length && c.certified) actions.push(["Operator","Dispatch "+c.caarId+" to "+c.invoice.vendor+" ("+(data.invoice.vendorContact||"AR contact")+")","Within 2 business days"]);
  if (fails.some(f=>f.id==="R211")) actions.push(["Purchasing","Confirm the contracted rate and lock period with the vendor rep; request the corrected price file","This week"]);
  if (fails.some(f=>f.id==="R228")) actions.push(["AP","Net the open credit memo against the next remittance; confirm application on the vendor statement","Next remittance"]);
  if (fails.some(f=>f.id==="R237")) actions.push(["AP","Send the resale certificate to the vendor's tax desk; request a tax-only credit","This week"]);
  if (fails.some(f=>f.id==="R221")) actions.push(["GM","Attach the signed receiving log to the claim; request a partial-delivery credit","Within 2 business days"]);
  if (c.vendorReliability.riskFlags.length>=3) actions.push(["Vendor management","Schedule a contract review — three or more active pattern flags on the certified record","This month"]);
  if (!actions.length) actions.push(["Operator","File the compliance certificate; no action required","—"]);
  actions.push(["Sentry","Re-certify on the next invoice from this vendor to extend the certified record","Next delivery"]);
  return { fails, lowGate, hypotheses: hyp.length?hyp:["No variance was found; nothing to hypothesize about. The vendor's pattern is the only open question, and the certified record answers it."], actions,
    summary: !c.certified
      ? `Invoice ${c.invoice.id} from ${c.invoice.vendor} could not be certified. R236 fired: Trust Score ${c.trustScore.score} against the 85 floor, ${c.trustScore.gatesPassed}/11 Trust Gates passed (${c.trustScore.trustGates.filter(g=>!g.passed).map(g=>g.id).join(", ")} failed). ${fails.length?`${fails.length} variance${fails.length>1?"s were":" was"} identified (${money(c.summary.totalRecovery)}) but ${fails.length>1?"they are":"it is"} exposure, not a certified claim, until the evidence gap closes.`:"No variances were identified on the evidence available."} The fastest path to a certified run is in the gap list.`
      : fails.length
      ? `Invoice ${c.invoice.id} from ${c.invoice.vendor} certified with ${fails.length} variance${fails.length>1?"s":""} totaling ${money(c.summary.totalRecovery)} (recovery probability ${c.summary.recoveryProbability}%). Trust Score ${c.trustScore.score}, all 11 Trust Gates passed; the lowest invoice-accuracy component was ${lowGate.id} ${lowGate.name} at ${lowGate.score}. The vendor's reliability record now reads ${c.vendorReliability.score} (${c.vendorReliability.classification}, ${c.vendorReliability.trend.toLowerCase()}).`
      : `Invoice ${c.invoice.id} from ${c.invoice.vendor} certified compliant. All ${c.summary.rulesEvaluated} evaluated rules passed; Trust Score ${c.trustScore.score}, all 11 Trust Gates passed. The vendor's reliability record improves to ${c.vendorReliability.score} (${c.vendorReliability.classification}) on certified evidence.` };
}

function MGEDemo(){
  const [step,setStep] = useState(0);
  const [fileName,setFileName] = useState("");
  const [docHash,setDocHash] = useState(null);
  const [phase,setPhase] = useState(0);
  const [certData,setCertData] = useState(null);
  const [error,setError] = useState(null);
  const [guideOpen,setGuideOpen] = useState(false);
  const [run,setRun] = useState(0);
  const [mode,setMode] = useState("single");
  const [staged,setStaged] = useState([]);
  const [custodian,setCustodian] = useState("");
  const [profile,setProfileState] = useState(()=>{ try { const p = sessionStorage.getItem("mge_profile"); return p ? JSON.parse(p) : null; } catch(e){ return null; } });
  const setProfile = p => { setProfileState(p); try { if (p) sessionStorage.setItem("mge_profile", JSON.stringify(p)); else sessionStorage.removeItem("mge_profile"); } catch(e){} };
  const [welcome,setWelcome] = useState(false);
  const [tourOpen,setTourOpen] = useState(false);
  const [visited,setVisited] = useState(()=>new Set());
  const [sealedRun,setSealedRun] = useState(false);
  const presetEmail = (typeof window!=="undefined" && new URLSearchParams(window.location.search).get("invite")) || "";
  const markVisited = k => setVisited(v=>{ if (v.has(k)) return v; const n=new Set(v); n.add(k); return n; });
  const logRef = useRef([]); const [logTick,setLogTick] = useState(0);
  const addLog = async ev => { await appendLog(logRef.current, ev); setLogTick(t=>t+1); };
  const [tip,setTip] = useState(null);
  const [chatOpen,setChatOpen] = useState(false);
  const [advisorKey,setAdvisorKey] = useState((typeof window!=="undefined" && window.MGE_ADVISOR_KEY) || null);
  const [docHashes,setDocHashes] = useState(null);

  const finalize = async (invoice, dHash, name, ctx={}) => {
    const result = runRules(invoice, {...ctx, docHash:dHash, log:logRef.current});
    const issued = new Date();
    const issuedAt = issued.toLocaleString("en-US",{month:"long",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",timeZone:"UTC"})+" UTC";
    const payload = JSON.stringify({docHash:dHash, docHashes:ctx.hashes||null, attestation:ctx.attestation||null, invoice:result.invoice, po:result.po, recvDoc:result.recvDoc, lineItems:result.lineItems, ruleResults:result.ruleResults, trustScore:result.trustScore, vendorScore:result.vendorScore, summary:result.summary});
    const payloadHash = await sha256(payload);
    const caarId = `CAAR-${issued.getFullYear()}-${payloadHash.slice(0,6).toUpperCase()}`;
    const iumId = `IUM-${payloadHash.slice(6,12).toUpperCase()}`;
    return {...result, docHash:dHash, docHashes:ctx.hashes||null, attestation:ctx.attestation||null, payloadHash, caarId, iumId, issuedAt, fileName:name, log:logRef.current};
  };

  const runPipeline = async (name, work) => {
    setFileName(name); setStep(2); setError(null); setCertData(null); setDocHash(null); setDocHashes(null); setPhase(0); setRun(r=>r+1);
    const tick = (n, ms) => new Promise(res=>setTimeout(()=>{setPhase(n);res();},ms));
    try {
      await tick(1,900);
      const {invoice, dHash, ctx={}} = await work();
      setDocHash(dHash); if (ctx.hashes) setDocHashes(ctx.hashes);
      await tick(2,1400); await addLog("Landing Zone seal verified against staged digests"); await tick(3,1300); await tick(4,1400); await addLog("Reconciled against contract, receiving log, tax profile, credit ledger"); await tick(5,1200); await tick(6,1300); await tick(7,1200);
      const data = await finalize(invoice, dHash, name, ctx);
      await addLog(`Certification complete — ${data.summary.certificationStatus} · payload seal ${short(data.payloadHash)} · ${data.caarId}`);
      await tick(8,1100);
      await new Promise(r=>setTimeout(r,900));
      setCertData(data); setStep(3);
    } catch(e){
      if (e.message==="PARSE_FAIL") setError(`The parser could not read this document as a vendor invoice. ${e.detail||""} The demo parser expects the invoice layout used by the sample document set; use one of those files, or run the built-in invoice.`);
      else setError(`Certification could not complete: ${e.message}`);
    }
  };

  const stageFiles = async (entries) => {
    logRef.current = []; setError(null);
    const out = [];
    for (const {file, hint} of entries){
      const buf = await file.arrayBuffer(); const hash = await sha256(buf); const receivedAt = new Date().toISOString();
      const intakeId = `INT-${hash.slice(0,6).toUpperCase()}`;
      await addLog(`Received ${file.name} · ${(file.size/1024).toFixed(0)} KB · sealed ${short(hash)} · ${intakeId}`);
      let rows=[]; try { rows = await extractRows(buf); } catch(e){}
      const proposed = rows.length ? classifyRows(rows) : (hint||"invoice");
      const parsed = {}; for (const [t,fn] of [["invoice",parseInvoice],["po",parsePO],["rl",parseReceiving]]) { try { parsed[t]=fn(rows,file.name); } catch(e){ parsed[t]=null; } }
      await addLog(`Classified ${intakeId} as ${DOC_TYPES[proposed].toLowerCase()} — parser proposal`);
      out.push({name:file.name, size:file.size, hash, intakeId, receivedAt, proposed, type:proposed, parsed, doc:parsed[proposed], corrected:false});
    }
    setStaged(out); setStep(1);
  };
  const handleUpload = file => stageFiles([{file, hint:"invoice"}]);
  const handleThreeWay = docs => stageFiles([{file:docs.invoice,hint:"invoice"}, ...(docs.po?[{file:docs.po,hint:"po"}]:[]), ...(docs.rl?[{file:docs.rl,hint:"rl"}]:[])]);
  const stageBuiltIn = async (three) => {
    logRef.current = []; setError(null);
    const mk = async (name, type, doc, obj) => { const hash = await sha256(JSON.stringify(obj)); const intakeId=`INT-${hash.slice(0,6).toUpperCase()}`; await addLog(`Received ${name} (built-in) · sealed ${short(hash)} · ${intakeId}`); await addLog(`Classified ${intakeId} as ${DOC_TYPES[type].toLowerCase()} — parser proposal`); return {name, size:0, hash, intakeId, receivedAt:new Date().toISOString(), proposed:type, type, parsed:{[type]:doc}, doc, corrected:false}; };
    const inv = {...DEMO_INVOICE,lineItems:DEMO_INVOICE.lineItems.map(l=>({...l}))};
    const items = [await mk("INV-2026-04392_Northstar_Foodservice.pdf","invoice",inv,DEMO_INVOICE)];
    if (three){ items.push(await mk("PO-BF-2211_Purchase_Order.pdf","po",{...DEMO_PO},DEMO_PO)); items.push(await mk("RL-04392_Receiving_Log.pdf","rl",{...DEMO_RL},DEMO_RL)); }
    setStaged(items); setStep(1);
  };
  const handlePush = async ({statement, custodian:name}) => {
    const inv = staged.find(f=>f.type==="invoice"&&f.doc); if (!inv) return;
    setSealedRun(true);
    const po = staged.find(f=>f.type==="po"&&f.doc); const rl = staged.find(f=>f.type==="rl"&&f.doc);
    const signedAt = new Date().toISOString();
    const attHash = await sha256(`${statement}|${name}|${signedAt}|${staged.map(f=>f.hash).join(",")}`);
    const attestation = {custodian:name, org:(profile&&profile.org)||CUSTODIAN_ORG, statement, signedAt, hash:attHash, files:staged.map(f=>({intakeId:f.intakeId,type:f.type,hash:f.hash}))};
    await addLog(`Attested & sealed by ${name}, Evidence Custodian · signature record ${short(attHash)} · ${staged.length} file${staged.length>1?"s":""}`);
    await addLog(`Batch pushed to MGE through the Sentry API contract · authorization: attestation ${short(attHash)}`);
    const hashes = {invoice:inv.hash, po:po?po.hash:null, rl:rl?rl.hash:null};
    const three = mode==="three" || !!po || !!rl;
    const label = staged.map(f=>f.name).join(" + ");
    return runPipeline(label, async ()=>({invoice:inv.doc, dHash:inv.hash, ctx:{threeWay:three, po:po?po.doc:null, recvDoc:rl?rl.doc:null, hashes:three?hashes:null, attestation}}));
  };
  const runDemo = () => stageBuiltIn(false);
  const runThreeWayDemo = () => stageBuiltIn(true);
  const reset = () => { setStep(0); setFileName(""); setCertData(null); setError(null); setGuideOpen(false); setDocHash(null); setPhase(0); setStaged([]); logRef.current=[]; setLogTick(t=>t+1); setSealedRun(false); setWelcome(false); };
  useEffect(()=>{ const k=["upload","attest","ingest","rules","findings","caar","advisory"][step]; if (profile && !welcome && k) markVisited(k); },[step,profile,welcome]);
  useEffect(()=>{ if (chatOpen) markVisited("chat"); },[chatOpen]);
  useEffect(()=>{ if (guideOpen||tip) markVisited("guide"); },[guideOpen,tip]);
  useEffect(()=>{ if (profile) markVisited("signin"); },[profile]);
  const signIn = p => { setProfile(p); setCustodian(p.name); setWelcome(true); };
  const signOut = () => { reset(); setProfile(null); setVisited(new Set()); };
  const tourGo = async (where) => {
    setTourOpen(false); setWelcome(false);
    const needRun = ["ingest","rules","findings","caar","advisory","chat"];
    if (where==="upload"){ reset(); return; }
    if (where==="attest"){ if (step===1) return; reset(); setTimeout(()=>stageBuiltIn(mode==="three"),50); return; }
    if (where==="guide"){ setGuideOpen(true); return; }
    if (needRun.includes(where)){
      if (!certData){ setError("Run a certification first — card 3 (Attest & seal) with the built-in set gets you there in about 30 seconds."); reset(); setTimeout(()=>{ setError(null); stageBuiltIn(mode==="three"); },50); return; }
      const idx = {ingest:2,rules:3,findings:4,caar:5,advisory:6}[where]; if (idx) setStep(idx);
      if (where==="chat") setChatOpen(true);
    }
  };

  const guideSection = !profile ? "signin" : (["upload","attest","ingest","rules","findings","caar","advisory"][step] || "upload");
  const guideLabel = ["GUIDE","ATTEST GUIDE","INGEST GUIDE","RULES GUIDE","FINDINGS GUIDE","CAAR GUIDE","ADVISORY GUIDE"][step] || "GUIDE";
  const content = [
    <StepUpload key="u" onUpload={handleUpload} onDemo={runDemo} onThreeWay={handleThreeWay} onThreeWayDemo={runThreeWayDemo} mode={mode} setMode={setMode}/>,
    <StepAttest key="attest" staged={staged} setStaged={setStaged} custodian={custodian} setCustodian={setCustodian} onPush={handlePush} log={logRef.current} logTick={logTick} mode={mode} org={profile&&profile.org} sealed={sealedRun}/>,
    <StepIngest key={`i${run}`} fileName={fileName} docHash={docHash} docHashes={docHashes} phase={phase}/>,
    certData?<StepRules key={`r${run}`} data={certData} onComplete={()=>setStep(4)}/>:<div/>,
    certData?<StepFindings key={`f${run}`} data={certData}/>:<div/>,
    certData?<StepCAAR key={`c${run}`} data={certData}/>:<div/>,
    certData?<StepAdvisory key={`a${run}`} data={certData} advisorKey={advisorKey} onOpenChat={()=>setChatOpen(true)}/>:<div/>,
  ];

  return (
    <TipCtx.Provider value={setTip}>
    <div style={{minHeight:"100vh",background:C.paper,display:"flex",flexDirection:"column",alignItems:"center"}}>
      <div style={{width:"100%",background:C.card,borderBottom:`1.5px solid ${C.green}`,padding:"14px 32px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:10,gap:14}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <a href="#" onClick={e=>{e.preventDefault(); if (profile) reset(); }} title="Home" style={{display:"inline-flex",textDecoration:"none"}}><Logo h={26}/></a>
          <span style={{color:C.line2,fontSize:18}}>|</span>
          <H s={{fontSize:15,fontWeight:800,color:C.ink,letterSpacing:"-0.01em"}}>MGE™</H>
          <M s={{fontSize:10,color:C.muted2,letterSpacing:"0.12em"}}>SENTRY · M04:SCR</M>
        </div>
        <div style={{fontSize:11,color:C.muted,fontFamily:F.mono,letterSpacing:"0.08em",textTransform:"uppercase"}}>Sentry™ module · MGE API contract · SOR pilot</div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {profile && <button onClick={()=>setTourOpen(true)} style={{fontSize:11,color:"#fff",background:C.gold,border:"none",borderRadius:6,padding:"7px 12px",cursor:"pointer",fontFamily:F.head,fontWeight:700}}>Guided demo ▶</button>}
          {profile && step>0 && <button onClick={reset} style={{fontSize:11,color:C.ink,background:"transparent",border:`1px solid ${C.line2}`,borderRadius:6,padding:"7px 12px",cursor:"pointer",fontFamily:F.mono,letterSpacing:"0.06em"}}>New invoice</button>}
          {profile && <div style={{display:"flex",alignItems:"center",gap:8,paddingLeft:8,borderLeft:`1px solid ${C.line}`}}><div style={{textAlign:"right",lineHeight:1.2}}><div style={{fontSize:11.5,fontWeight:600,color:C.ink}}>{profile.name}</div><M s={{fontSize:9,color:C.muted2}}>Owner · <span style={{color:C.gold,fontWeight:700}}>EC</span> Evidence Custodian</M></div><button onClick={signOut} title="Sign out" style={{fontSize:10,color:C.muted,background:"transparent",border:`1px solid ${C.line2}`,borderRadius:6,padding:"5px 8px",cursor:"pointer",fontFamily:F.mono}}>Sign out</button></div>}
        </div>
      </div>
      {profile&&!welcome&&step>0&&<div style={{width:"100%",maxWidth:880,padding:"32px 36px 0"}}><ProgressBar step={step}/></div>}
      {error&&(
        <div style={{width:"100%",maxWidth:880,padding:"24px 36px 0"}}>
          <Card accent={C.red}>
            <Label color={C.red} style={{marginBottom:8}}>Certification halted</Label>
            <div style={{fontSize:13,color:C.ink,lineHeight:1.6,marginBottom:14}}>{error}</div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              <button onClick={reset} style={{color:C.ink,background:"transparent",border:`1px solid ${C.line2}`,cursor:"pointer",fontSize:12,fontFamily:F.mono,padding:"9px 14px",borderRadius:7}}>← Try another file</button>
              <button onClick={runDemo} style={{color:"#fff",background:C.ink,border:"none",cursor:"pointer",fontSize:12,fontFamily:F.mono,fontWeight:600,padding:"9px 14px",borderRadius:7}}>▶ Run built-in invoice</button>
            </div>
          </Card>
        </div>
      )}
      {!profile ? <SignIn onSignedIn={signIn} presetEmail={presetEmail}/>
        : welcome ? <div style={{width:"100%",maxWidth:880,padding:"44px 36px 150px",flex:1}}><Welcome profile={profile} onDemo={()=>{setWelcome(false);setTourOpen(true);}} onSkip={()=>setWelcome(false)}/></div>
        : <div style={{width:"100%",maxWidth:880,padding:"44px 36px 150px",flex:1}}>{!error && content[step]}</div>}
      {profile&&!welcome&&step>=1&&step<=6&&certData&&(
        <div style={{position:"fixed",bottom:0,left:0,right:0,background:"rgba(255,255,255,.92)",backdropFilter:"blur(8px)",borderTop:`1px solid ${C.line}`,padding:"14px 32px",display:"flex",justifyContent:"center",zIndex:5}}>
          <div style={{display:"flex",gap:12,width:"100%",maxWidth:880}}>
            {step>1&&<button onClick={()=>setStep(s=>s-1)} style={{flex:1,background:C.card,border:`1px solid ${C.line2}`,color:C.ink,padding:"14px 0",borderRadius:10,fontSize:14,fontWeight:600,cursor:"pointer"}}>← Back</button>}
            {step<5
              ? <button onClick={()=>setStep(s=>s+1)} style={{flex:2,background:C.ink,border:"none",color:"#fff",padding:"14px 0",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:F.head}}>{step===4?"Issue CAAR →":step===3?"View findings →":step===2?"Rules →":"Ingest →"}</button>
              : step===5
              ? <><button onClick={()=>setStep(6)} style={{flex:2,background:C.steel,border:"none",color:"#fff",padding:"14px 0",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:F.head}}>Open Advisory Memorandum → (separate document)</button>
                  <button onClick={reset} style={{flex:1,background:C.green,border:"none",color:"#fff",padding:"14px 0",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:F.head}}>↺ New invoice</button></>
              : <button onClick={reset} style={{flex:1,background:C.green,border:"none",color:"#fff",padding:"14px 0",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:F.head}}>↺ New invoice</button>}
          </div>
        </div>
      )}
      {profile && !welcome && !guideOpen && !tip && !chatOpen && !tourOpen && step!==2 && <FloatingGuideButton onClick={()=>setGuideOpen(true)} label={guideLabel}/>}
      {profile && certData && step>=4 && !chatOpen && !guideOpen && !tip && !tourOpen && <FloatingChatButton onClick={()=>setChatOpen(true)}/>}
      {tip && <TipDrawer id={tip} onClose={()=>setTip(null)}/>}
      {tourOpen && <GuidedDemo visited={visited} onGo={tourGo} onClose={()=>setTourOpen(false)} profile={profile}/>}
      {chatOpen && <AdvisorChat data={certData} advisorKey={advisorKey} setAdvisorKey={setAdvisorKey} onClose={()=>setChatOpen(false)}/>}
      {guideOpen&&(<>
        <div onClick={()=>setGuideOpen(false)} style={{position:"fixed",inset:0,background:"rgba(20,23,26,.35)",zIndex:50,animation:"fadeIn .25s ease-out"}}/>
        <div style={{position:"fixed",top:0,right:0,bottom:0,width:"min(400px,100vw)",zIndex:51,animation:"slideIn .3s cubic-bezier(.22,1,.36,1)",boxShadow:"-8px 0 32px rgba(20,23,26,.18)"}}>
          <UserGuidePanel initialSection={guideSection} onClose={()=>setGuideOpen(false)}/>
        </div>
      </>)}
    </div>
    </TipCtx.Provider>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<MGEDemo/>);
</script>
</body>
</html>
